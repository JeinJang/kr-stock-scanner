# KRX Scanner Configuration
scanner:
  # markets: ["KOSPI", "KOSDAQ", "ETF"]
  markets: ["KOSPI", "KOSDAQ"]
  lookback_days: 250
  max_ai_analyze: 50

news:
  provider: "naver_api"
  max_articles_per_stock: 5
  search_days: 3

ai:
  model: "gpt-5-nano"
  max_tokens: 600

telegram:
  enabled: true

forecast:
  horizon: 60
  model: "google/timesfm-2.5-200m-pytorch"
  report_dir: "reports"

schedule:
  run_time: "16:00"
  timezone: "Asia/Seoul"

fundamentals:
  years_lookback: 10
  cache_ttl_days: 30
  report_dir: "reports"
  market_filter: ["KOSPI", "KOSDAQ"]

related:
  model: "gpt-5-nano"
  report_dir: "reports"
  max_tokens_per_section: 8000

aihw:
  ai_hw_tickers:
    NVDA: 엔비디아
    AVGO: 브로드컴
    005930.KS: 삼성전자
    000660.KS: SK하이닉스
    MU: 마이크론
    SNDK: 샌디스크
  big_tech_tickers:
    AMZN: 아마존
    TSLA: 테슬라
    MSFT: MS
    META: 메타
    GOOGL: 구글
  benchmarks: ["SPY", "RSP"]
  base_date: "2026-01-10"
  threshold: 0.8
  report_dir: "reports"
  auto_send: true
